{% extends 'base.html' %}
{% block title %}
Meu perfil
{% endblock %}
{% block content %}
<section class="form-card">
    <h1>Meu perfil</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <label>Usuário</label>
        <input value="{{ user.username }}" disabled>
        <button class="button primary" type="submit">Salvar alterações</button>
    </form>
</section>

{% endblock %}
