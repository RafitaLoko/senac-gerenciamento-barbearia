{% extends 'base.html' %}
{% block title %}Cadastro
{% endblock %}
{% block content %}

<section class="form-card">
    <h1>Criar conta</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button>Cadastrar</button>
    </form>
    <a href="{% url 'login_cliente' %}">Já tenho conta</a>
</section>

{% endblock %}
