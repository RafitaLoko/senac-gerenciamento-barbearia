{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>
    {% block title %}
    Barber King
    {% endblock %}
  </title>
  <link rel="stylesheet" href="{% static 'visitors/css/style.css' %}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{% url 'home' %}">♛ BARBER KING</a>
  {% if user.is_authenticated %}
  <nav>
    <a href="{% url 'dashboard_cliente' %}">Início</a>
    <a href="{% url 'logout' %}">Sair</a>
  </nav>
  {% else %}
  <nav><a href="{% url 'login' %}">Entrar</a></nav>
  {% endif %}
</header>
<main class="container">
  {% for message in messages %}
  <div class="message">
    {{ message }}
  </div>
  
  {% endfor %}
  {% block content %}
  
  {% endblock %}
</main>

<footer>
  BARBER KING · Estilo em boas mãos
</footer>

</body>
</html>
